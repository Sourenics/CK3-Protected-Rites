name: Suggestion
description: Propose an improvement or a new feature
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the idea. If it is about a specific rite, council or setting, please name it.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
      description: How would it improve your games?
